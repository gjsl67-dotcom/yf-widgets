<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예스폼 습관 위젯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;900&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 모노톤 : 검정, 흰색, 회색 단계만 사용 */
  :root{--ink:#111111;--ink2:#3A3A3A;--sub:#8C8C8C;--faint:#C8C8C8;--line:#E4E4E4;--tint:#F3F3F3;--bg:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Tight','Gothic A1',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:2px 6px}
  /* 노션 임베드 높이가 내용보다 작아도 스크롤바는 보이지 않게 */
  html,body{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  #app{min-height:100%}
  .w{padding:18px 20px;width:100%}
  .solo #app{display:flex;min-height:calc(100vh - 4px)}
  .solo .w{flex:1;display:flex;flex-direction:column}
  .kr{font-family:'Gothic A1',sans-serif}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .ttl{font-family:'Inter Tight';font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .meta{font-size:10px;color:var(--sub);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .lab{font-family:'Gothic A1';font-size:11px;color:var(--sub);margin-bottom:8px}

  /* ---------- habits ---------- */
  .hab .big{font-family:'Inter Tight';font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:10px;font-weight:700;letter-spacing:.14em}
  .pill i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
  .tbl{border:1.5px solid var(--ink)}
  .wk{display:grid;grid-template-columns:34px 1fr 34px;border-bottom:1.5px solid var(--ink);height:34px}
  .wk button{display:grid;place-items:center;font-size:14px}
  .wk button:first-child{border-right:1px solid var(--line)} .wk button:last-child{border-left:1px solid var(--line)}
  .wk button:hover{background:var(--tint)}
  .wk span{display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;color:var(--sub);font-weight:600}
  .wk span b{color:var(--ink);letter-spacing:.06em;font-weight:700;margin-left:8px;font-size:12px}
  .done{font-size:10px;color:var(--sub);letter-spacing:.14em;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
  .grid{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(7,minmax(30px,1fr))}
  .grid>div{display:flex;align-items:center;justify-content:center;height:34px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  .grid>div.hn{justify-content:space-between;border-left:0;padding:0 10px;font-family:'Gothic A1';font-size:12.5px;font-weight:700;gap:6px;position:relative}
  .grid .hn small{font-family:'Inter Tight';font-size:10px;color:var(--faint);font-weight:500}
  .grid .hn .del{position:absolute;left:-2px;opacity:0;font-size:12px;color:var(--sub);width:14px}
  .grid .hn:hover .del{opacity:1}
  .grid .hh{font-size:10px;color:var(--sub);letter-spacing:.12em;font-weight:600}
  .grid .hh.first{justify-content:flex-start;padding-left:10px;border-left:0}
  .grid .hh.td{background:var(--ink);color:#fff}
  .grid .td{background:var(--tint)}
  .grid>div:nth-last-child(-n+8){border-bottom:0}
  .box{width:16px;height:16px;border:1.5px solid var(--ink2);border-radius:2px;display:grid;place-items:center;transition:background .12s}
  .box svg{width:10px;height:10px;opacity:0}
  .box.on{background:var(--ink);border-color:var(--ink)} .box.on svg{opacity:1}
  .fut .box{border-color:var(--faint)}
  .add{display:grid;grid-template-columns:1fr auto;border-top:1.5px solid var(--ink);height:38px}
  .add input{border:0;outline:none;padding:0 12px;font-size:11px;letter-spacing:.1em;background:transparent;font-family:'Inter Tight','Gothic A1'}
  .add input::placeholder{color:var(--faint);text-transform:uppercase}
  .add button{background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:0 18px}

  /* ---------- clock ---------- */
  .clock{justify-content:center}
  .clock .hello{font-family:'Gothic A1';font-size:12px;color:var(--sub);margin-bottom:6px}
  .clock .time{font-weight:800;font-size:clamp(48px,10vw,88px);line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .clock .time em{font-style:normal;color:var(--faint);margin:0 .12em;position:relative;top:-.06em}
  .clock .date{font-family:'Gothic A1';font-size:12px;color:var(--sub);margin-top:10px}
  .clock .date b{font-family:'Inter Tight';font-weight:700;color:var(--ink);margin-right:8px;letter-spacing:.14em;font-size:10px}

  /* ---------- note ---------- */
  .notew{justify-content:center}
  .notew .ttl{margin-bottom:12px}
  .note p{font-family:'Gothic A1';font-size:clamp(16px,3vw,20px);line-height:1.6;font-weight:400;color:var(--ink2);outline:none;letter-spacing:-.2px}
  .note p:focus{background:var(--tint)}
  .note small{display:block;margin-top:10px;font-family:'Gothic A1';font-size:11px;color:var(--faint)}

  /* ---------- check-in ---------- */
  .moods{display:flex;gap:4px;margin-bottom:14px}
  .mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 0;border:1px solid transparent;font-family:'Gothic A1';font-size:10.5px;color:var(--sub)}
  .mood i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink2)}
  .mood:hover{background:var(--tint)}
  .mood.on{border-color:var(--ink);color:var(--ink);font-weight:700}
  textarea{width:100%;border:0;resize:none;font-family:'Gothic A1';font-size:13px;line-height:28px;color:var(--ink);outline:none;background:transparent;
    background-image:linear-gradient(to bottom,transparent 27px,var(--line) 27px);background-size:100% 28px;padding:0}
  textarea::placeholder{color:var(--faint)}

  /* ---------- progress ---------- */
  .prow{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:12px;padding:7px 0}
  .prow .k{font-family:'Gothic A1';font-size:12px}
  .prow .v{font-size:11px;font-weight:700;text-align:right}
  .prow .bar{height:5px;background:var(--line);overflow:hidden}
  .prow .bar i{display:block;height:100%;background:var(--ink)}

  /* ---------- board : 노션 기본 높이 약 470px ---------- */
  .board{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"hab clock" "hab note" "hab chk";width:100%}
  .board>.w{padding:14px 20px;border:0 solid var(--line)}
  .board .b-hab{grid-area:hab;border-right-width:1px}
  .board .b-clock{grid-area:clock;border-bottom-width:1px}
  .board .b-note{grid-area:note;border-bottom-width:1px}
  .board .b-chk{grid-area:chk}
  .board .clock .time{font-size:46px}
  .board .clock .mini{margin-top:12px}
  .board .clock .prow{padding:3px 0;grid-template-columns:44px 1fr 34px}
  .board .note p{font-size:16px}
  .board .notew .ttl{margin-bottom:8px}
  .board .note small{display:none}
  .board .hab .head{margin-bottom:10px}
  .board .hab .big{font-size:26px}
  .board .grid>div{height:29px}
  .board .wk{height:30px}
  .board .add{height:34px}
  .board .moods{margin-bottom:6px}
  .board .mood{padding:6px 0;gap:5px}
  .board textarea{height:26px}
  .board>.w{padding:12px 18px}
  .board textarea{line-height:26px;background-size:100% 26px;background-image:linear-gradient(to bottom,transparent 25px,var(--line) 25px)}
  @media (max-width:820px){.board{grid-template-columns:1fr 1fr;grid-template-areas:"hab hab" "clock note" "chk chk"}
    .board>.w{border-width:0 0 1px 0 !important}}
  @media (max-width:520px){.board{grid-template-columns:1fr;grid-template-areas:"hab" "clock" "note" "chk"}}

  .gal{display:grid;gap:16px;max-width:900px;margin:0 auto}
  .gal .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .gal .w{border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const only=qs.get('w');               // board | habits | clock | progress | checkin | note
  const DEFAULT=(qs.get('habits')||'기상 7시,물 2L,스트레칭,독서 20분,영양제,두 줄 일기').split(',');
  const store={get(k,d){try{return JSON.parse(localStorage.getItem('yf_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('yf_'+k,JSON.stringify(v))}catch(e){}}};
  const pad=n=>String(n).padStart(2,'0');
  const today=new Date();today.setHours(0,0,0,0);
  const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const DN=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const D1=['M','T','W','T','F','S','S'];
  const KD=['일','월','화','수','목','금','토'];
  const CHECK='<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="square"><path d="M2 5.2 4.2 7.3 8 2.8"/></svg>';
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function habits(){
    const w=document.createElement('div');w.className='w hab';
    const data=store.get('habits',{});
    let list=store.get('habit_list',DEFAULT).slice(0,8);
    let off=0;
    w.innerHTML=`<div class="head"><span class="big">HABITS</span><span class="pill"><i></i><span class="pc"></span></span></div>
      <div class="tbl"><div class="wk"><button class="prev" aria-label="지난주">‹</button><span>WEEK<b class="rg"></b></span><button class="next" aria-label="다음 주">›</button></div>
      <div class="grid"></div>
      <form class="add"><input maxlength="14" placeholder="new habit" aria-label="새 습관"><button type="submit">+ ADD</button></form></div>`;
    const g=w.querySelector('.grid');
    function week(){const m=new Date(today);m.setDate(today.getDate()-((today.getDay()+6)%7)+off*7);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});}
    function render(){
      const wk=week();
      w.querySelector('.rg').textContent=`${pad(wk[0].getMonth()+1)}/${pad(wk[0].getDate())} ~ ${pad(wk[6].getMonth()+1)}/${pad(wk[6].getDate())}`;
      const ti=wk.findIndex(d=>key(d)===key(today));
      g.innerHTML='<div class="hh first">HABIT</div>'+wk.map((d,i)=>`<div class="hh ${i===ti?'td':''}">${D1[i]}</div>`).join('');
      list.forEach((h,r)=>{
        const cnt=wk.filter(d=>(data[key(d)]||{})[h]).length;
        const hn=document.createElement('div');hn.className='hn';hn.innerHTML=`<button class="del" aria-label="${esc(h)} 삭제">×</button><span>${esc(h)}</span><small>${cnt}/7</small>`;
        // 노션 임베드는 확인창(confirm)이 막혀 있어서 두 번 눌러 삭제
        const del=hn.querySelector('.del');del.onclick=()=>{if(del.dataset.arm){list=list.filter(x=>x!==h);store.set('habit_list',list);render();}else{del.dataset.arm='1';del.textContent='삭제';del.style.cssText='opacity:1;width:auto;left:auto;right:6px;font-size:10px;background:#111;color:#fff;padding:2px 6px';setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent='×';del.style.cssText='';}},2500);}};
        g.appendChild(hn);
        wk.forEach((d,i)=>{const k=key(d);const on=!!(data[k]||{})[h];
          const c=document.createElement('div');if(i===ti)c.classList.add('td');if(d>today)c.classList.add('fut');
          const b=document.createElement('button');b.className='box'+(on?' on':'');b.innerHTML=CHECK;b.setAttribute('aria-label',h+' '+k);
          b.onclick=()=>{data[k]=data[k]||{};data[k][h]=!data[k][h];store.set('habits',data);render();};
          c.appendChild(b);g.appendChild(c);});
      });
      const t=data[key(today)]||{};const done=list.filter(h=>t[h]).length;
      w.querySelector('.pc').textContent=`${done} / ${list.length} DONE`;
    }
    w.querySelector('.prev').onclick=()=>{off--;render();};
    w.querySelector('.next').onclick=()=>{off++;render();};
    w.querySelector('.add').onsubmit=e=>{e.preventDefault();const inp=w.querySelector('.add input');const v=inp.value.trim();if(!v||list.includes(v))return;if(list.length>=8){inp.value='';inp.placeholder='최대 8개까지';return;}list.push(v);store.set('habit_list',list);inp.value='';render();};
    render();return w;
  }
  function progRows(){
    const n=new Date();const dayP=(n.getHours()*60+n.getMinutes())/1440;
    const dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();const mo=(n.getDate()-1+dayP)/dim;
    const y0=new Date(n.getFullYear(),0,1),y1=new Date(n.getFullYear()+1,0,1);const yr=(n-y0)/(y1-y0);
    const wk=((n.getDay()+6)%7+dayP)/7;
    return {dayP,wk,mo,yr,row:(k,v)=>`<div class="prow"><span class="k">${k}</span><div class="bar"><i style="width:${(v*100).toFixed(1)}%"></i></div><span class="v">${Math.round(v*100)}%</span></div>`};
  }
  function clock(withProg){
    const w=document.createElement('div');w.className='w clock';
    function tick(){const n=new Date();const h=n.getHours();
      const hello=h<5?'늦은 밤이에요':h<11?'좋은 아침이에요':h<17?'오늘도 잘 하고 있어요':h<21?'수고한 저녁이에요':'오늘 하루, 마무리할 시간';
      const p=progRows();
      w.innerHTML=`<div class="hello">${hello}</div><div class="time">${pad(h)}<em>:</em>${pad(n.getMinutes())}</div><div class="date"><b>${DN[(n.getDay()+6)%7]}</b>${n.getMonth()+1}월 ${n.getDate()}일 ${KD[n.getDay()]}요일</div>`+(withProg?`<div class="mini">${p.row('이번 달',p.mo)}${p.row('올해',p.yr)}</div>`:'');}
    tick();setInterval(tick,10000);return w;
  }
  function progress(){
    const w=document.createElement('div');w.className='w';const p=progRows();const n=new Date();
    w.innerHTML=`<div class="head"><span class="ttl">progress</span><span class="meta">${n.getFullYear()}</span></div>`+p.row('오늘',p.dayP)+p.row('이번 주',p.wk)+p.row('이번 달',p.mo)+p.row('올해',p.yr);
    return w;
  }
  function checkin(){
    const w=document.createElement('div');w.className='w';
    const all=store.get('checkin',{});const t=all[key(today)]||{mood:'',text:''};
    const moods=[['지침','#FFFFFF'],['그저 그럼','#E4E4E4'],['괜찮음','#B5B5B5'],['좋음','#6E6E6E'],['최고','#111111']];
    w.innerHTML=`<div class="head"><span class="ttl">check-in</span><span class="meta">${pad(today.getMonth()+1)}/${pad(today.getDate())}</span></div><div class="moods">${moods.map(([m,c])=>`<button class="mood ${t.mood===m?'on':''}" data-m="${m}"><i style="background:${c}"></i>${m}</button>`).join('')}</div><textarea rows="2" placeholder="오늘을 두 줄로 남겨 보세요">${esc(t.text||'')}</textarea>`;
    w.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{t.mood=b.dataset.m;all[key(today)]=t;store.set('checkin',all);w.querySelectorAll('.mood').forEach(x=>x.classList.toggle('on',x===b));});
    w.querySelector('textarea').oninput=e=>{t.text=e.target.value;all[key(today)]=t;store.set('checkin',all);};
    return w;
  }
  function note(){
    const w=document.createElement('div');w.className='w notew';
    const txt=store.get('note',qs.get('text')||'완벽하게 말고,\n끊기지 않게.');
    w.innerHTML=`<span class="ttl">today's note</span><div class="note"><p contenteditable="true" spellcheck="false"></p><small>눌러서 내 문장으로 바꿔 쓰기</small></div>`;
    const p=w.querySelector('p');p.innerText=txt;p.oninput=()=>store.set('note',p.innerText);
    return w;
  }
  function board(){
    const b=document.createElement('div');b.className='board';
    [[habits(),'b-hab'],[clock(false),'b-clock'],[note(),'b-note'],[checkin(),'b-chk']].forEach(([el,c])=>{el.classList.add(c);b.appendChild(el);});
    return b;
  }
  const M={board,habits,clock:()=>clock(false),progress,checkin,note};
  const app=document.getElementById('app');
  if(only&&M[only]){document.body.classList.add('solo');app.appendChild(M[only]());}
  else{
    const g=document.createElement('div');g.className='gal';
    const two=document.createElement('div');two.className='two';two.append(clock(false),note());
    const two2=document.createElement('div');two2.className='two';two2.append(checkin(),progress());
    g.append(two,habits(),two2);app.appendChild(g);
  }
})();
</script>
</body>
</html>
