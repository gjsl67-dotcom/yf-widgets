<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예스폼 습관 위젯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;900&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 모노톤 : 검정, 흰색, 회색 단계만 사용 */
  :root{--ink:#111111;--ink2:#3A3A3A;--sub:#8C8C8C;--faint:#C8C8C8;--line:#E4E4E4;--tint:#F3F3F3;--bg:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Tight','Gothic A1',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:2px 6px}
  /* 노션 임베드 높이가 내용보다 작아도 스크롤바는 보이지 않게 */
  html,body{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  #app{min-height:100%}
  .w{padding:18px 20px;width:100%}
  .solo #app{display:flex;min-height:calc(100vh - 4px)}
  .solo .w{flex:1;display:flex;flex-direction:column}
  .kr{font-family:'Gothic A1',sans-serif}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .ttl{font-family:'Inter Tight';font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .meta{font-size:10px;color:var(--sub);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .lab{font-family:'Gothic A1';font-size:11px;color:var(--sub);margin-bottom:8px}

  /* ---------- habits ---------- */
  .hab .big{font-family:'Inter Tight';font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:10px;font-weight:700;letter-spacing:.14em}
  .pill i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
  .tbl{border:1.5px solid var(--ink)}
  .wk{display:grid;grid-template-columns:34px 1fr 34px;border-bottom:1.5px solid var(--ink);height:34px}
  .wk button{display:grid;place-items:center;font-size:14px}
  .wk button:first-child{border-right:1px solid var(--line)} .wk button:last-child{border-left:1px solid var(--line)}
  .wk button:hover{background:var(--tint)}
  .wk span{display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;color:var(--sub);font-weight:600}
  .wk span b{color:var(--ink);letter-spacing:.06em;font-weight:700;margin-left:8px;font-size:12px}
  .done{font-size:10px;color:var(--sub);letter-spacing:.14em;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
  .grid{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(7,minmax(30px,1fr))}
  .grid>div{display:flex;align-items:center;justify-content:center;height:34px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  .grid>div.hn{justify-content:space-between;border-left:0;padding:0 10px;font-family:'Gothic A1';font-size:12.5px;font-weight:700;gap:6px;position:relative}
  .grid .hn small{font-family:'Inter Tight';font-size:10px;color:var(--faint);font-weight:500}
  .grid .hn .del{position:absolute;left:-2px;opacity:0;font-size:12px;color:var(--sub);width:14px}
  .grid .hn:hover .del{opacity:1}
  .grid .hh{font-size:10px;color:var(--sub);letter-spacing:.12em;font-weight:600}
  .grid .hh.first{justify-content:flex-start;padding-left:10px;border-left:0}
  .grid .hh.td{background:var(--ink);color:#fff}
  .grid .td{background:var(--tint)}
  .grid>div:nth-last-child(-n+8){border-bottom:0}
  .box{width:16px;height:16px;border:1.5px solid var(--ink2);border-radius:2px;display:grid;place-items:center;transition:background .12s}
  .box svg{width:10px;height:10px;opacity:0}
  .box.on{background:var(--ink);border-color:var(--ink)} .box.on svg{opacity:1}
  .fut .box{border-color:var(--faint)}
  .add{display:grid;grid-template-columns:1fr auto;border-top:1.5px solid var(--ink);height:38px}
  .add input{border:0;outline:none;padding:0 12px;font-size:11px;letter-spacing:.1em;background:transparent;font-family:'Inter Tight','Gothic A1'}
  .add input::placeholder{color:var(--faint);text-transform:uppercase}
  .add button{background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:0 18px}

  /* ---------- clock ---------- */
  .clock{justify-content:center}
  .clock .hello{font-family:'Gothic A1';font-size:12px;color:var(--sub);margin-bottom:6px}
  .clock .time{font-weight:800;font-size:clamp(48px,10vw,88px);line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .clock .time em{font-style:normal;color:var(--faint);margin:0 .12em;position:relative;top:-.06em}
  .clock .date{font-family:'Gothic A1';font-size:12px;color:var(--sub);margin-top:10px}
  .clock .date b{font-family:'Inter Tight';font-weight:700;color:var(--ink);margin-right:8px;letter-spacing:.14em;font-size:10px}

  /* ---------- note ---------- */
  .notew{justify-content:center}
  .notew .ttl{margin-bottom:12px}
  .note p{font-family:'Gothic A1';font-size:clamp(16px,3vw,20px);line-height:1.6;font-weight:400;color:var(--ink2);outline:none;letter-spacing:-.2px}
  .note p:focus{background:var(--tint)}
  .note small{display:block;margin-top:10px;font-family:'Gothic A1';font-size:11px;color:var(--faint)}

  /* ---------- check-in ---------- */
  .moods{display:flex;gap:4px;margin-bottom:14px}
  .mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 0;border:1px solid transparent;font-family:'Gothic A1';font-size:10.5px;color:var(--sub)}
  .mood i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink2)}
  .mood:hover{background:var(--tint)}
  .mood.on{border-color:var(--ink);color:var(--ink);font-weight:700}
  textarea{width:100%;border:0;resize:none;font-family:'Gothic A1';font-size:13px;line-height:28px;color:var(--ink);outline:none;background:transparent;
    background-image:linear-gradient(to bottom,transparent 27px,var(--line) 27px);background-size:100% 28px;padding:0}
  textarea::placeholder{color:var(--faint)}

  /* ---------- progress ---------- */
  .prow{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:12px;padding:7px 0}
  .prow .k{font-family:'Gothic A1';font-size:12px}
  .prow .v{font-size:11px;font-weight:700;text-align:right}
  .prow .bar{height:5px;background:var(--line);overflow:hidden}
  .prow .bar i{display:block;height:100%;background:var(--ink)}

  /* ---------- board : 노션 기본 높이 약 470px ---------- */
  .board{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"hab clock" "hab note" "hab chk";width:100%}
  .board>.w{padding:14px 20px;border:0 solid var(--line)}
  .board .b-hab{grid-area:hab;border-right-width:1px}
  .board .b-clock{grid-area:clock;border-bottom-width:1px}
  .board .b-note{grid-area:note;border-bottom-width:1px}
  .board .b-chk{grid-area:chk}
  .board .clock .time{font-size:46px}
  .board .clock .mini{margin-top:12px}
  .board .clock .prow{padding:3px 0;grid-template-columns:44px 1fr 34px}
  .board .note p{font-size:16px}
  .board .notew .ttl{margin-bottom:8px}
  .board .note small{display:none}
  .board .hab .head{margin-bottom:10px}
  .board .hab .big{font-size:26px}
  .board .grid>div{height:29px}
  .board .wk{height:30px}
  .board .add{height:34px}
  .board .moods{margin-bottom:6px}
  .board .mood{padding:6px 0;gap:5px}
  .board textarea{height:26px}
  .board>.w{padding:12px 18px}
  .board textarea{line-height:26px;background-size:100% 26px;background-image:linear-gradient(to bottom,transparent 25px,var(--line) 25px)}
  @media (max-width:820px){.board{grid-template-columns:1fr 1fr;grid-template-areas:"hab hab" "clock note" "chk chk"}
    .board>.w{border-width:0 0 1px 0 !important}}
  @media (max-width:520px){.board{grid-template-columns:1fr;grid-template-areas:"hab" "clock" "note" "chk"}}

  /* ---------- year heatmap ---------- */
  .year .yhead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
  .year .yr{font-size:10px;color:var(--sub);letter-spacing:.14em;font-weight:600}
  .year .big{font-family:'Inter Tight';font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.1}
  .stats{display:flex}
  .stat{border-left:1px solid var(--line);padding:0 16px;min-width:120px}
  .stat b{font-family:'Inter Tight';font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
  .stat b small{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.14em;margin-left:5px;vertical-align:middle}
  .stat span{display:block;font-family:'Gothic A1';font-size:10.5px;color:var(--sub);margin-top:4px}
  .hm{display:grid;grid-template-columns:18px 1fr;gap:0 6px}
  .hm .dl{display:grid;grid-template-rows:repeat(7,1fr);font-size:9px;color:var(--faint);font-weight:600}
  .hm .dl span{display:flex;align-items:center}
  .hm .mo{display:grid;grid-column:2;font-size:9px;color:var(--sub);letter-spacing:.1em;font-weight:600;margin-bottom:4px;height:12px;position:relative}
  .hm .mo span{position:absolute;top:0}
  .cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(0,20px);justify-content:space-between;gap:3px}
  .cell{aspect-ratio:1;width:100%;max-width:20px;border-radius:2px;background:var(--line);cursor:default;position:relative}
  .cell.l0{background:#EEEEEE}.cell.l1{background:#C8C8C8}.cell.l2{background:#7A7A7A}.cell.l3{background:#111111}
  .cell.fut{background:transparent;border:1px solid var(--line)}
  .cell.td{outline:2px solid var(--ink);outline-offset:-1px}
  .cell:hover::after{content:attr(data-t);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Gothic A1';font-size:10px;white-space:nowrap;padding:4px 8px;border-radius:3px;z-index:9;pointer-events:none}
  .legend{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:9px;color:var(--sub);letter-spacing:.12em;font-weight:600}
  .legend .r{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:2px;display:block}
  .legend em{font-style:normal;font-family:'Gothic A1';font-size:10px;letter-spacing:0;color:var(--ink2);font-weight:400}

  /* ---------- ⋯ menu & dialogs ---------- */
  .hd-r{display:flex;align-items:center;gap:8px}
  .more{width:26px;height:26px;border-radius:4px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;line-height:1;display:grid;place-items:center}
  .menu{position:absolute;right:0;top:32px;width:200px;background:#fff;border:1.5px solid var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.08);z-index:20;display:none}
  .menu.open{display:block}
  .menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;font-family:'Gothic A1';font-size:12.5px;font-weight:500;border-top:1px solid var(--line);text-align:left}
  .menu button:first-child{border-top:0}
  .menu button:hover{background:var(--tint)}
  .menu button em{font-style:normal;font-family:'Inter Tight';font-size:9px;color:var(--faint);letter-spacing:.12em;font-weight:700}
  .menu button.danger{color:#B23B3B}
  .menu button.danger.arm{background:#B23B3B;color:#fff}
  .menu button.danger.arm em{color:#fff}
  .menuwrap{position:relative}
  .dlg{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
  .dlg.open{display:flex}
  .dlg .box2{width:min(560px,100%);background:#fff;border:1.5px solid var(--ink);padding:24px 26px}
  .dlg .eyebrow{font-size:10px;color:var(--sub);letter-spacing:.16em;font-weight:700}
  .dlg h3{font-family:'Gothic A1';font-size:20px;font-weight:700;margin:6px 0 12px}
  .dlg p{font-family:'Gothic A1';font-size:12px;color:var(--sub);line-height:1.6}
  .dlg textarea{margin:14px 0;height:110px;background:var(--tint);border:0;padding:12px;font-family:'Inter Tight',monospace;font-size:11px;line-height:1.5;color:var(--ink2);word-break:break-all;background-image:none}
  .dlg textarea.in{background:#fff;border:1.5px solid var(--ink)}
  .dlg .meta2{font-family:'Gothic A1';font-size:11px;color:var(--sub)}
  .dlg .opts{display:grid;gap:8px;margin:12px 0 4px}
  .dlg .opt{display:flex;align-items:center;gap:10px;font-family:'Gothic A1';font-size:12px;cursor:pointer}
  .dlg .opt i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
  .dlg .opt input{display:none}
  .dlg .opt input:checked+i::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .dlg .opt b{font-weight:700}
  .dlg .opt span{color:var(--sub);margin-left:4px}
  .dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .dlg .acts button{height:38px;padding:0 22px;font-family:'Gothic A1';font-size:12.5px;font-weight:700}
  .dlg .acts .pri{background:var(--ink);color:#fff}
  .dlg .acts .sec{border:1.5px solid var(--ink)}
  .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Gothic A1';font-size:12px;padding:10px 18px;border-radius:999px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  .gal{display:grid;gap:16px;max-width:900px;margin:0 auto}
  .gal .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .gal .w{border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const only=qs.get('w');               // board | habits | clock | progress | checkin | note
  const DEFAULT=(qs.get('habits')||'기상 7시,물 2L,스트레칭,독서 20분,영양제,두 줄 일기').split(',');
  const store={get(k,d){try{return JSON.parse(localStorage.getItem('yf_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('yf_'+k,JSON.stringify(v))}catch(e){}}};
  const pad=n=>String(n).padStart(2,'0');
  const today=new Date();today.setHours(0,0,0,0);
  const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const DN=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const D1=['M','T','W','T','F','S','S'];
  const KD=['일','월','화','수','목','금','토'];
  const CHECK='<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="square"><path d="M2 5.2 4.2 7.3 8 2.8"/></svg>';
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function habits(){
    const w=document.createElement('div');w.className='w hab';
    const data=store.get('habits',{});
    let list=store.get('habit_list',DEFAULT).slice(0,8);
    let off=0;
    w.innerHTML=`<div class="head"><span class="big">HABITS</span><div class="hd-r"><span class="pill"><i></i><span class="pc"></span></span><div class="menuwrap"><button class="more" aria-label="메뉴">⋯</button><div class="menu">
        <button data-a="export">기록 내보내기<em>EXPORT</em></button><button data-a="import">기록 불러오기<em>IMPORT</em></button><button data-a="reset" class="danger">기록 모두 지우기<em>RESET</em></button></div></div></div></div>
      <div class="tbl"><div class="wk"><button class="prev" aria-label="지난주">‹</button><span>WEEK<b class="rg"></b></span><button class="next" aria-label="다음 주">›</button></div>
      <div class="grid"></div>
      <form class="add"><input maxlength="14" placeholder="new habit" aria-label="새 습관"><button type="submit">+ ADD</button></form></div>`;
    const g=w.querySelector('.grid');
    function week(){const m=new Date(today);m.setDate(today.getDate()-((today.getDay()+6)%7)+off*7);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});}
    function render(){
      const wk=week();
      w.querySelector('.rg').textContent=`${pad(wk[0].getMonth()+1)}/${pad(wk[0].getDate())} ~ ${pad(wk[6].getMonth()+1)}/${pad(wk[6].getDate())}`;
      const ti=wk.findIndex(d=>key(d)===key(today));
      g.innerHTML='<div class="hh first">HABIT</div>'+wk.map((d,i)=>`<div class="hh ${i===ti?'td':''}">${D1[i]}</div>`).join('');
      list.forEach((h,r)=>{
        const cnt=wk.filter(d=>(data[key(d)]||{})[h]).length;
        const hn=document.createElement('div');hn.className='hn';hn.innerHTML=`<button class="del" aria-label="${esc(h)} 삭제">×</button><span>${esc(h)}</span><small>${cnt}/7</small>`;
        // 노션 임베드는 확인창(confirm)이 막혀 있어서 두 번 눌러 삭제
        const del=hn.querySelector('.del');del.onclick=()=>{if(del.dataset.arm){list=list.filter(x=>x!==h);store.set('habit_list',list);render();}else{del.dataset.arm='1';del.textContent='삭제';del.style.cssText='opacity:1;width:auto;left:auto;right:6px;font-size:10px;background:#111;color:#fff;padding:2px 6px';setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent='×';del.style.cssText='';}},2500);}};
        g.appendChild(hn);
        wk.forEach((d,i)=>{const k=key(d);const on=!!(data[k]||{})[h];
          const c=document.createElement('div');if(i===ti)c.classList.add('td');if(d>today)c.classList.add('fut');
          const b=document.createElement('button');b.className='box'+(on?' on':'');b.innerHTML=CHECK;b.setAttribute('aria-label',h+' '+k);
          b.onclick=()=>{data[k]=data[k]||{};data[k][h]=!data[k][h];store.set('habits',data);render();};
          c.appendChild(b);g.appendChild(c);});
      });
      const t=data[key(today)]||{};const done=list.filter(h=>t[h]).length;
      w.querySelector('.pc').textContent=`${done} / ${list.length} DONE`;
    }
    w.querySelector('.prev').onclick=()=>{off--;render();};
    w.querySelector('.next').onclick=()=>{off++;render();};
    // ⋯ menu
    const menu=w.querySelector('.menu');const more=w.querySelector('.more');
    more.onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
    document.addEventListener('click',()=>{menu.classList.remove('open');const d=menu.querySelector('.danger');if(d){d.classList.remove('arm');d.firstChild.textContent='기록 모두 지우기';}});
    menu.onclick=e=>e.stopPropagation();
    menu.querySelector('[data-a=export]').onclick=()=>{menu.classList.remove('open');openExport();};
    menu.querySelector('[data-a=import]').onclick=()=>{menu.classList.remove('open');openImport(()=>{Object.assign(data,store.get('habits',{}));for(const k in data){if(!(k in store.get('habits',{})))delete data[k];}list=store.get('habit_list',DEFAULT).slice(0,8);render();});};
    const rst=menu.querySelector('[data-a=reset]');
    rst.onclick=()=>{if(rst.classList.contains('arm')){['habits','habit_list','checkin','note'].forEach(k=>{try{localStorage.removeItem('yf_'+k)}catch(e){}});for(const k in data)delete data[k];list=DEFAULT.slice(0,8);menu.classList.remove('open');rst.classList.remove('arm');rst.firstChild.textContent='기록 모두 지우기';render();toast('기록을 모두 지웠어요');}else{rst.classList.add('arm');rst.firstChild.textContent='한 번 더 누르면 지워져요';}};
    w.querySelector('.add').onsubmit=e=>{e.preventDefault();const inp=w.querySelector('.add input');const v=inp.value.trim();if(!v||list.includes(v))return;if(list.length>=8){inp.value='';inp.placeholder='최대 8개까지';return;}list.push(v);store.set('habit_list',list);inp.value='';render();};
    render();return w;
  }
  function progRows(){
    const n=new Date();const dayP=(n.getHours()*60+n.getMinutes())/1440;
    const dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();const mo=(n.getDate()-1+dayP)/dim;
    const y0=new Date(n.getFullYear(),0,1),y1=new Date(n.getFullYear()+1,0,1);const yr=(n-y0)/(y1-y0);
    const wk=((n.getDay()+6)%7+dayP)/7;
    return {dayP,wk,mo,yr,row:(k,v)=>`<div class="prow"><span class="k">${k}</span><div class="bar"><i style="width:${(v*100).toFixed(1)}%"></i></div><span class="v">${Math.round(v*100)}%</span></div>`};
  }
  function clock(withProg){
    const w=document.createElement('div');w.className='w clock';
    function tick(){const n=new Date();const h=n.getHours();
      const hello=h<5?'늦은 밤이에요':h<11?'좋은 아침이에요':h<17?'오늘도 잘 하고 있어요':h<21?'수고한 저녁이에요':'오늘 하루, 마무리할 시간';
      const p=progRows();
      w.innerHTML=`<div class="hello">${hello}</div><div class="time">${pad(h)}<em>:</em>${pad(n.getMinutes())}</div><div class="date"><b>${DN[(n.getDay()+6)%7]}</b>${n.getMonth()+1}월 ${n.getDate()}일 ${KD[n.getDay()]}요일</div>`+(withProg?`<div class="mini">${p.row('이번 달',p.mo)}${p.row('올해',p.yr)}</div>`:'');}
    tick();setInterval(tick,10000);return w;
  }
  function progress(){
    const w=document.createElement('div');w.className='w';const p=progRows();const n=new Date();
    w.innerHTML=`<div class="head"><span class="ttl">progress</span><span class="meta">${n.getFullYear()}</span></div>`+p.row('오늘',p.dayP)+p.row('이번 주',p.wk)+p.row('이번 달',p.mo)+p.row('올해',p.yr);
    return w;
  }
  function checkin(){
    const w=document.createElement('div');w.className='w';
    const all=store.get('checkin',{});const t=all[key(today)]||{mood:'',text:''};
    const moods=[['지침','#FFFFFF'],['그저 그럼','#E4E4E4'],['괜찮음','#B5B5B5'],['좋음','#6E6E6E'],['최고','#111111']];
    w.innerHTML=`<div class="head"><span class="ttl">check-in</span><span class="meta">${pad(today.getMonth()+1)}/${pad(today.getDate())}</span></div><div class="moods">${moods.map(([m,c])=>`<button class="mood ${t.mood===m?'on':''}" data-m="${m}"><i style="background:${c}"></i>${m}</button>`).join('')}</div><textarea rows="2" placeholder="오늘을 두 줄로 남겨 보세요">${esc(t.text||'')}</textarea>`;
    w.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{t.mood=b.dataset.m;all[key(today)]=t;store.set('checkin',all);w.querySelectorAll('.mood').forEach(x=>x.classList.toggle('on',x===b));});
    w.querySelector('textarea').oninput=e=>{t.text=e.target.value;all[key(today)]=t;store.set('checkin',all);};
    return w;
  }
  function note(){
    const w=document.createElement('div');w.className='w notew';
    const txt=store.get('note',qs.get('text')||'완벽하게 말고,\n끊기지 않게.');
    w.innerHTML=`<span class="ttl">today's note</span><div class="note"><p contenteditable="true" spellcheck="false"></p><small>눌러서 내 문장으로 바꿔 쓰기</small></div>`;
    const p=w.querySelector('p');p.innerText=txt;p.oninput=()=>store.set('note',p.innerText);
    return w;
  }
  // ---------- backup : export / import ----------
  function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent='✓  '+msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
  function encode(){const payload={v:1,habits:store.get('habits',{}),list:store.get('habit_list',DEFAULT),checkin:store.get('checkin',{}),note:store.get('note',null)};
    return 'YF1.'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));}
  function decode(s){s=String(s).trim();if(!s.startsWith('YF1.'))throw new Error('형식');return JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));}
  function dialog(html){let d=document.querySelector('.dlg');if(!d){d=document.createElement('div');d.className='dlg';document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.classList.remove('open');};}
    d.innerHTML=`<div class="box2">${html}</div>`;d.classList.add('open');return d;}
  function openExport(){const code=encode();const days=Object.keys(store.get('habits',{})).length;const n=store.get('habit_list',DEFAULT).length;
    const d=dialog(`<div class="eyebrow">EXPORT</div><h3>기록 내보내기</h3><p>아래 글자를 복사해서 메모장이나 카톡 나에게 보내기에 붙여 두세요.<br>다른 기기 위젯에서 불러오기를 누르고 붙여 넣으면 그대로 옮겨져요.</p><textarea readonly></textarea><div class="meta2">습관 ${n}개, 기록 ${days}일, ${(code.length/1024).toFixed(1)}KB</div><div class="acts"><button class="sec">닫기</button><button class="pri">복사하기</button></div>`);
    d.querySelector('textarea').value=code;
    d.querySelector('.sec').onclick=()=>d.classList.remove('open');
    d.querySelector('.pri').onclick=async()=>{const ta=d.querySelector('textarea');try{await navigator.clipboard.writeText(code);toast('복사했어요');}catch(e){ta.focus();ta.select();try{document.execCommand('copy');toast('복사했어요');}catch(e2){toast('길게 눌러 직접 복사해 주세요');}}};}
  function openImport(after){const d=dialog(`<div class="eyebrow">IMPORT</div><h3>기록 불러오기</h3><p>다른 기기에서 복사해 둔 글자를 붙여 넣어 주세요.</p><textarea class="in" placeholder="여기에 붙여 넣기"></textarea><div class="opts"><label class="opt"><input type="radio" name="m" value="merge" checked><i></i><b>합치기</b><span>지금 기록은 두고 빠진 날만 채워요</span></label><label class="opt"><input type="radio" name="m" value="replace"><i></i><b>바꾸기</b><span>지금 기록을 지우고 붙여 넣은 기록으로 바꿔요</span></label></div><div class="acts"><button class="sec">닫기</button><button class="pri">불러오기</button></div>`);
    d.querySelector('.sec').onclick=()=>d.classList.remove('open');
    d.querySelector('.pri').onclick=()=>{let p;try{p=decode(d.querySelector('textarea').value);}catch(e){toast('형식이 맞지 않아요. YF1. 으로 시작하는 글자인지 확인해 주세요');return;}
      const mode=d.querySelector('input[name=m]:checked').value;
      if(mode==='replace'){store.set('habits',p.habits||{});store.set('habit_list',p.list||DEFAULT);store.set('checkin',p.checkin||{});if(p.note)store.set('note',p.note);}
      else{const h=store.get('habits',{});for(const k in (p.habits||{})){h[k]=Object.assign({},p.habits[k],h[k]||{});}store.set('habits',h);
        const l=store.get('habit_list',DEFAULT);(p.list||[]).forEach(x=>{if(!l.includes(x)&&l.length<8)l.push(x);});store.set('habit_list',l);
        const c=store.get('checkin',{});for(const k in (p.checkin||{})){if(!c[k])c[k]=p.checkin[k];}store.set('checkin',c);
        if(p.note&&!store.get('note',null))store.set('note',p.note);}
      d.classList.remove('open');toast(`기록 ${Object.keys(p.habits||{}).length}일을 불러왔어요`);if(after)after();};}

  // ---------- year heatmap ----------
  function year(){
    const w=document.createElement('div');w.className='w year';
    // 위젯 판(다른 임베드)에서 체크하면 바로 따라 그리기 : storage 이벤트 + 5초마다 변경 확인
    let sig='';const draw=()=>{const s=(localStorage.getItem('yf_habits')||'')+'|'+(localStorage.getItem('yf_habit_list')||'');if(s===sig)return;sig=s;renderYear(w);};
    try{window.addEventListener('storage',draw);setInterval(draw,5000);}catch(e){}
    draw();return w;
  }
  function renderYear(w){
    const data=store.get('habits',{});const list=store.get('habit_list',DEFAULT);
    const Y=today.getFullYear();
    const ratio=k=>{const d=data[k];if(!d)return 0;const n=list.filter(h=>d[h]).length;return list.length?n/list.length:0;};
    const lvl=r=>r===0?0:r<0.5?1:r<1?2:3;
    // stats
    let streak=0;for(let i=0;;i++){const d=new Date(today);d.setDate(today.getDate()-i);const r=ratio(key(d));if(r>0)streak++;else{if(i===0)continue;break;}if(i>400)break;}
    let best=0,cur=0;const y0=new Date(Y,0,1);for(let d=new Date(y0);d<=today;d.setDate(d.getDate()+1)){if(ratio(key(d))>0){cur++;best=Math.max(best,cur);}else cur=0;}
    let doneDays=0;for(let d=new Date(y0);d<=today;d.setDate(d.getDate()+1)){if(ratio(key(d))>0)doneDays++;}
    const stat=(n,u,k)=>`<div class="stat"><b>${n}<small>${u}</small></b><span>${k}</span></div>`;
    // grid: columns = weeks from the Monday on/before Jan 1
    const start=new Date(y0);start.setDate(y0.getDate()-((y0.getDay()+6)%7));
    const end=new Date(Y,11,31);const weeks=Math.ceil(((end-start)/86400000+1)/7);
    const MO=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    let months='';for(let m=0;m<12;m++){const d=new Date(Y,m,1);const col=Math.floor(((d-start)/86400000)/7);months+=`<span style="left:${(col/weeks*100).toFixed(2)}%">${MO[m]}</span>`;}
    let cells='';for(let c=0;c<weeks;c++)for(let r=0;r<7;r++){const d=new Date(start);d.setDate(start.getDate()+c*7+r);const k=key(d);
      if(d.getFullYear()!==Y){cells+='<div class="cell" style="visibility:hidden"></div>';continue;}
      if(d>today){cells+=`<div class="cell fut"></div>`;continue;}
      const dd=data[k];const n=dd?list.filter(h=>dd[h]).length:0;const t=`${d.getMonth()+1}월 ${d.getDate()}일 (${KD[d.getDay()]})  ${n}/${list.length}`;
      cells+=`<div class="cell l${lvl(ratio(k))}${k===key(today)?' td':''}" data-t="${t}"></div>`;}
    w.innerHTML=`<div class="yhead"><div><div class="yr">${Y}</div><div class="big">HABITS YEAR</div></div><div class="stats">${stat(streak,'DAYS','연속 기록')}${stat(best,'DAYS','최장 연속')}${stat(doneDays,'DAYS','올해 달성')}</div></div>
      <div class="hm"><div></div><div class="mo">${months}</div><div class="dl"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span></span></div><div class="cells">${cells}</div></div>
      <div class="legend"><div class="r"><em>■ 오늘</em><em style="color:var(--sub);margin-left:10px">칸에 마우스를 올리면 그날 기록이 떠요</em></div><div class="r">LESS <i style="background:#EEEEEE"></i><i style="background:#C8C8C8"></i><i style="background:#7A7A7A"></i><i style="background:#111111"></i> MORE</div></div>`;
  }
  function board(){
    const b=document.createElement('div');b.className='board';
    [[habits(),'b-hab'],[clock(false),'b-clock'],[note(),'b-note'],[checkin(),'b-chk']].forEach(([el,c])=>{el.classList.add(c);b.appendChild(el);});
    return b;
  }
  const M={board,year,habits,clock:()=>clock(false),progress,checkin,note};
  const app=document.getElementById('app');
  if(only&&M[only]){document.body.classList.add('solo');app.appendChild(M[only]());}
  else{
    const g=document.createElement('div');g.className='gal';
    const two=document.createElement('div');two.className='two';two.append(clock(false),note());
    const two2=document.createElement('div');two2.className='two';two2.append(checkin(),progress());
    g.append(two,habits(),two2);app.appendChild(g);
  }
})();
</script>
